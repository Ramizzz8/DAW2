<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ventanas emergentes</title>
</head>

<body>

    <h1>Prueba de ventanas emergentes</h1>

    <input id="urlfavorita" placeholder="URL de tu pagina web favorita">
    <br></br>
      
    <button onclick="abrirVentana()">
        Abrir ventana
    </button>

    <script>
        function abrirVentana() {
            const url = document.getElementById("urlfavorita").value;
            window.open(
                url,
                "_blank"
            );

        }

    </script>

</body>

</html>
