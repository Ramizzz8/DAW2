<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>¿Estás en Valencia?</title>
	<style>
		:root { font-family: Arial, sans-serif; color: #17324d; background: #eef5f8; }
		body { display: grid; place-items: center; min-height: 100vh; margin: 0; }
		main { width: min(92%, 520px); padding: 2rem; background: white; border-radius: 14px; box-shadow: 0 8px 25px #17324d22; }
		h1 { margin-top: 0; color: #007f86; }
		label { display: block; margin: 1rem 0 .4rem; font-weight: bold; }
		input, button { box-sizing: border-box; width: 100%; padding: .75rem; border: 1px solid #b7cbd3; border-radius: 7px; font-size: 1rem; }
		button { margin-top: 1.2rem; border: 0; color: white; background: #007f86; cursor: pointer; font-weight: bold; }
		button:hover { background: #00636a; }
		#resultado { margin-top: 1.5rem; padding: 1rem; border-radius: 7px; background: #f2f7f8; line-height: 1.6; }
		.error { color: #a32626; } .si { color: #087b45; } .no { color: #a15b00; }
		small { color: #586d78; }
	</style>
</head>
<body>
	<main>
		<h1>¿Estás en Valencia, España?</h1>
		<p>Introduce una dirección IPv4 o IPv6 para consultar sus coordenadas.</p>
		<form id="formulario">
			<label for="ip">Dirección IP</label>
			<input id="ip" name="ip" placeholder="Ej.: 8.8.8.8" required>
			<button type="submit">Consultar ubicación</button>
		</form>
		<div id="resultado" aria-live="polite">Aquí aparecerá el resultado.</div>
		<small>La geolocalización por IP es aproximada y puede no coincidir con tu ubicación real.</small>
	</main>
	<script>
		const formulario = document.getElementById('formulario');
		const resultado = document.getElementById('resultado');

		formulario.addEventListener('submit', async (evento) => {
			evento.preventDefault();
			const ip = document.getElementById('ip').value.trim();
			resultado.className = '';
			resultado.textContent = 'Consultando...';
			try {
				const respuesta = await fetch(`https://ipapi.co/${encodeURIComponent(ip)}/json/`);
				if (!respuesta.ok) throw new Error('No se pudo consultar la IP');
				const datos = await respuesta.json();
				if (datos.error || typeof datos.latitude !== 'number' || typeof datos.longitude !== 'number') {
					throw new Error(datos.reason || 'La IP no es válida');
				}

				// Área aproximada de la provincia de Valencia (latitud 39.8–40.3, longitud -1.5–0.2).
				const enValencia = datos.latitude >= 39.8 && datos.latitude <= 40.3 &&
													 datos.longitude >= -1.5 && datos.longitude <= 0.2;
				resultado.className = enValencia ? 'si' : 'no';
				resultado.innerHTML = `<strong>${enValencia ? 'Sí' : 'No'}, estás aproximadamente ${enValencia ? 'en' : 'fuera de'} Valencia, España.</strong><br>` +
					`Latitud: ${datos.latitude}<br>Longitud: ${datos.longitude}<br>` +
					`Ubicación detectada: ${datos.city || 'desconocida'}, ${datos.country_name || 'desconocido'}`;
			} catch (error) {
				resultado.className = 'error';
				resultado.textContent = `Error: ${error.message}. Comprueba la IP y tu conexión.`;
			}
		});
	</script>
</body>
</html>
